# Test Profile Configuration (H2 In-Memory DB in MySQL compatibility mode)
spring.application.name=SkillMatch-Test

spring.datasource.url=jdbc:h2:mem:skillmatch_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

skillmatch.upload.dir=target/test-uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
