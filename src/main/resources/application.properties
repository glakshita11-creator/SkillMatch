# SkillMatch Application Configuration
spring.application.name=SkillMatch
server.port=8080

# MySQL Database Configuration
# Overridable via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillmatch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Settings (Resume PDF storage)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
skillmatch.upload.dir=${UPLOAD_DIR:uploads/resumes}

# Session Management
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=SKILLMATCH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
