<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Opportunities — SkillMatch</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
    <header class="navbar" id="main-navbar"></header>

    <main class="page-wrapper">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">Explore Campus Opportunities</h1>
            <p style="color: var(--surface-500);">Search and filter verified full-time positions, internships, and pre-placement opportunities.</p>
        </div>

        <!-- Search & Filter Controls Card -->
        <div class="card" style="margin-bottom: 2rem; padding: 1.5rem;">
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 1rem; align-items: end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" for="filter-query">Search Keywords</label>
                    <input type="text" id="filter-query" class="form-control" placeholder="Search by role, company, skills, or city...">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" for="filter-type">Type</label>
                    <select id="filter-type" class="form-select">
                        <option value="">All Types</option>
                        <option value="FULL_TIME">Full Time</option>
                        <option value="INTERNSHIP">Internship</option>
                        <option value="PART_TIME">Part Time</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" for="filter-dept">Department</label>
                    <select id="filter-dept" class="form-select">
                        <option value="">All Departments</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" for="filter-sort">Sort By</label>
                    <select id="filter-sort" class="form-select">
                        <option value="newest">Newest First</option>
                        <option value="deadline">Approaching Deadline</option>
                        <option value="company">Company Name (A-Z)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" class="btn btn-primary" id="btn-apply-filters">
                        Filter
                    </button>
                    <button type="button" class="btn btn-secondary" id="btn-reset-filters">
                        Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Counter & Grid -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <div style="font-weight: 700; color: var(--surface-700);" id="results-count-text">
                Showing opportunities...
            </div>
        </div>

        <div id="opportunities-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem;">
            <!-- Dynamically injected -->
            <div style="text-align: center; padding: 3rem; color: var(--surface-500); grid-column: 1 / -1;">
                Loading opportunities...
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-bottom">
                <div>&copy; 2026 SkillMatch — Placement and Internship Management System.</div>
                <div>Campus Recruitment Platform</div>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            SkillMatch.initNavbar('opportunities');
            loadOpportunities();

            document.getElementById('btn-apply-filters').addEventListener('click', loadOpportunities);
            document.getElementById('btn-reset-filters').addEventListener('click', () => {
                document.getElementById('filter-query').value = '';
                document.getElementById('filter-type').value = '';
                document.getElementById('filter-dept').value = '';
                document.getElementById('filter-sort').value = 'newest';
                loadOpportunities();
            });

            // Enter key trigger on search input
            document.getElementById('filter-query').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') loadOpportunities();
            });
        });

        async function loadOpportunities() {
            const query = document.getElementById('filter-query').value;
            const type = document.getElementById('filter-type').value;
            const dept = document.getElementById('filter-dept').value;
            const sort = document.getElementById('filter-sort').value;

            const grid = document.getElementById('opportunities-grid');
            const countText = document.getElementById('results-count-text');

            grid.innerHTML = '<div style="text-align:center; padding:3rem; grid-column:1/-1;">Searching opportunities...</div>';

            const params = new URLSearchParams();
            if (query) params.append('query', query);
            if (type) params.append('type', type);
            if (dept) params.append('department', dept);
            if (sort) params.append('sort', sort);

            try {
                const res = await SkillMatch.apiRequest(`/api/opportunities?${params.toString()}`);
                if (res && res.data) {
                    const opps = res.data;
                    countText.textContent = `${opps.length} opportunit${opps.length === 1 ? 'y' : 'ies'} found`;

                    if (opps.length === 0) {
                        grid.innerHTML = `
                            <div class="card" style="text-align:center; padding:3rem; grid-column:1/-1;">
                                <div style="font-size:2.5rem; margin-bottom:1rem;">🔍</div>
                                <h3 style="margin-bottom:0.5rem;">No matching opportunities found</h3>
                                <p style="color:var(--surface-500); max-width:400px; margin:0 auto 1.5rem;">
                                    Try adjusting your search criteria or resetting the filters.
                                </p>
                            </div>
                        `;
                        return;
                    }

                    grid.innerHTML = opps.map(o => {
                        let eligibilityHtml = '';
                        if (o.alreadyApplied) {
                            eligibilityHtml = `<span class="badge badge-APPLIED">✓ Applied</span>`;
                        } else if (o.eligibleForCurrentUser) {
                            eligibilityHtml = `<span class="opp-eligibility-badge eligible">✓ Eligible</span>`;
                        } else {
                            eligibilityHtml = `<span class="opp-eligibility-badge ineligible">⚠️ Criteria Mismatch</span>`;
                        }

                        // Skills tags
                        let skillsHtml = '';
                        if (o.requiredSkills) {
                            skillsHtml = o.requiredSkills.split(',')
                                .slice(0, 4)
                                .map(s => `<span class="tag">${SkillMatch.escapeHtml(s.trim())}</span>`)
                                .join('');
                        }

                        return `
                            <div class="opp-card">
                                <div>
                                    <div class="opp-header">
                                        <div style="display:flex; gap:0.5rem; align-items:center;">
                                            <span class="badge ${o.opportunityType === 'INTERNSHIP' ? 'badge-UNDER_REVIEW' : 'badge-SHORTLISTED'}">
                                                ${o.opportunityType.replace('_', ' ')}
                                            </span>
                                            ${eligibilityHtml}
                                        </div>
                                        <div style="font-weight:700; color:var(--primary-700); font-size:0.95rem;">
                                            ${SkillMatch.escapeHtml(o.salaryOrStipend || 'Competitive')}
                                        </div>
                                    </div>

                                    <h3 class="opp-title" style="margin-top:0.25rem;">
                                        <a href="/opportunity-details.html?id=${o.id}" style="color:inherit;">${SkillMatch.escapeHtml(o.title)}</a>
                                    </h3>
                                    <div class="opp-company">${SkillMatch.escapeHtml(o.companyName)}</div>

                                    <div class="opp-meta">
                                        <span class="opp-meta-item">📍 ${SkillMatch.escapeHtml(o.location)}</span>
                                        <span class="opp-meta-item">🏢 ${o.workplaceType.replace('_', ' ')}</span>
                                        <span class="opp-meta-item">🎯 Min CGPA: ${o.minCgpa}</span>
                                        <span class="opp-meta-item">⏳ Deadline: ${SkillMatch.formatDate(o.deadline)}</span>
                                    </div>

                                    <div style="margin-bottom:1rem;">
                                        ${skillsHtml}
                                    </div>
                                </div>

                                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:1rem; border-top:1px solid var(--surface-100);">
                                    <span style="font-size:0.82rem; color:var(--surface-500);">
                                        👥 ${o.openings} opening${o.openings > 1 ? 's' : ''} • ${o.applicationCount} applicant${o.applicationCount === 1 ? '' : 's'}
                                    </span>
                                    <a href="/opportunity-details.html?id=${o.id}" class="btn btn-outline btn-sm">
                                        View Details →
                                    </a>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                grid.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--danger-main); grid-column:1/-1;">Error loading opportunities: ${SkillMatch.escapeHtml(err.message)}</div>`;
            }
        }
    </script>
</body>
</html>
