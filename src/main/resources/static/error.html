<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) — SkillMatch</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body style="background: linear-gradient(135deg, var(--surface-50) 0%, var(--primary-50) 100%);">
    <header class="navbar" id="main-navbar"></header>

    <main class="page-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 180px);">
        <div class="card" style="max-width: 500px; width: 100%; text-align: center; padding: 3rem 2rem; box-shadow: var(--shadow-xl); border-top: 5px solid var(--primary-600);">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
            <h1 style="font-size: 2.2rem; color: var(--primary-900); margin-bottom: 0.75rem;">Page Not Found</h1>
            <p style="color: var(--surface-500); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
                The page or opportunity resource you requested does not exist or may have been moved.
            </p>
            <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                <a href="/opportunities.html" class="btn btn-secondary">
                    Browse Opportunities
                </a>
                <a href="/index.html" class="btn btn-primary">
                    Return to Homepage
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-bottom">
                <div>&copy; 2026 SkillMatch — Placement and Internship Management System.</div>
                <div>Campus Recruitment Platform</div>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            SkillMatch.initNavbar('');
        });
    </script>
</body>
</html>
