# Fallback In-Memory profile for quick local demo when MySQL is not running
spring.application.name=SkillMatch-Dev-H2

spring.datasource.url=jdbc:h2:file:./data/skillmatch_h2;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console available at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

skillmatch.upload.dir=uploads/resumes
